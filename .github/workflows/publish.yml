name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tag:
    name: validate tag
    if: github.ref_protected == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify tag matches project version and main ancestry
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          project_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v") or tag.removeprefix("v") != project_version:
              raise SystemExit(
                  f"Tag {tag!r} does not match project version {project_version!r}"
              )
          if subprocess.run(
              ["git", "merge-base", "--is-ancestor", os.environ["GITHUB_SHA"], "origin/main"],
              check=False,
          ).returncode:
              raise SystemExit("Release tag must point to a commit on or descended from main")
          print(f"Validated release tag {tag} for version {project_version}")
          PY

      - name: Require publication-ready documentation
        run: |
          if grep -RniE "first release pending|pending the release gates|not yet|unreleased" README.md docs; then
            echo "Release-facing documentation still contains stale pre-publication wording."
            exit 1
          fi

  ci:
    name: complete CI release gate
    needs: tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: publish to PyPI
    needs: [tag, ci]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/povineq
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download CI-validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: povineq-distributions
          path: dist/

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
